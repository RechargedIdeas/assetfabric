# [INFERENCE] Minimal CI shape for F0 — chat required acceptance harness on PR.
name: F0 CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install + test
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          forge status
          pytest -q
          ALLOW_STRUCTURE_ONLY=1 ./scripts/smoke_godot.sh
