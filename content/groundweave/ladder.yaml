# GroundWeave (C8) — GPU→CPU fallback ladder for every forge op.
# Each op lists backends best-first. Selection walks the ladder and takes the first
# backend whose device is present AND whose implementation exists on this checkout
# (`impl: real`). A `cpu` backend with `impl: real` is mandatory unless the op declares
# `gpu_required: true` with `route: loomcluster` (then the job must be sent to a node
# that advertises a matching device).
# `budget_s_2core` is the wall-clock budget for the CPU backend on the weakest
# acceptance node (2 cores, no GPU); `forge groundweave verify` enforces it and also checks the
# pinned/GPU-hidden output is byte-identical to the unpinned run. `probe_brief` is a brief id, or
# `runtime:<name>` for a Godot-headless probe; ops without a probe are reported `not_probed`, never silently ok.
schema_version: "1.0"
acceptance_node: {cores: 2, gpu: false}
devices: [rocm, directml, vulkan, cpu]
ops:
  gen.sprite:
    kind: sprite
    budget_s_2core: 20
    probe_brief: hero_kael
    ladder:
      - {id: g1-sprite-onnx-tiny, device: rocm, impl: planned}
      - {id: g1-sprite-onnx-tiny, device: vulkan, impl: planned}
      - {id: g1-sprite-procedural, device: cpu, impl: real}
  gen.tilemap:
    kind: tilemap
    budget_s_2core: 30
    probe_brief: cave_01
    ladder:
      - {id: g1-tile-nca, device: rocm, impl: planned}
      - {id: g1-tile-ca, device: cpu, impl: real}
  gen.material:
    kind: material
    budget_s_2core: 30
    probe_brief: mat_cave_stone
    ladder:
      - {id: dyeworks-sdxl, device: rocm, impl: planned}
      - {id: dyeworks-sd15, device: directml, impl: planned}
      - {id: dyeworks-procedural, device: cpu, impl: real}
  gen.audio:
    kind: audio
    budget_s_2core: 60
    probe_brief: music_cave
    ladder:
      - {id: g1-audio-procedural, device: cpu, impl: real}
  gen.codegen:
    kind: codegen
    budget_s_2core: 20
    probe_brief: roster
    ladder:
      - {id: codegen, device: cpu, impl: real}
  gen.callouts:
    kind: callouts
    budget_s_2core: 30
    probe_brief: callouts
    ladder:
      - {id: persona-bigram, device: cpu, impl: real}
  lm.persona:
    budget_s_2core: 60
    probe_brief: "runtime:persona-lm"
    requires_model: qwen2.5-0.5b-instruct-onnx
    note: >-
      Persona micro-LM (SPEC backbone Qwen2.5-0.5B, Apache-2.0): int8 ONNX on the onnxruntime CPU EP, own KV-cache decoding loop,
      persona-card prompt; drafts lines for human review (`forge persona author`), never loaded by the game (callout cache +
      in-engine bigram stay the runtime path, G-AI-03). Probe: one greedy line, intra-op threads = 1 (byte-identical tokens).
      Per-character LoRA adapters need GPU training → planned. Without the weights `verify` reports `model_absent`.
    ladder:
      - {id: qwen-lora-rocm, device: rocm, impl: planned}
      - {id: qwen2.5-0.5b-int8-onnx-cpu, device: cpu, impl: real}
  stt.voice:
    budget_s_2core: 30
    probe_brief: "runtime:voice"
    requires_model: vosk-small-en-us-0.15
    note: >-
      VoiceBridge (ADR-0006): Vosk small en-us (Apache-2.0) constrained to the closed intent grammar, word-confidence gate
      (< 0.7 → unknown). Probe: the 20 committed synthetic-speech fixtures → intents (accuracy ≥ 0.85, wrong-action ≤ 0.08).
      whisper.cpp (the spec's optional accurate fallback) is not built. Without the model `verify` reports `model_absent`.
    ladder:
      - {id: vosk-small-grammar-cpu, device: cpu, impl: real}
  gen.persona_lm:
    kind: persona_lm
    budget_s_2core: 30
    probe_brief: persona_lm
    ladder:
      - {id: persona-bigram-train, device: cpu, impl: real}
  gen.policy:
    kind: policy
    budget_s_2core: 120
    probe_brief: policy_target
    ladder:
      - {id: mlp-train-rocm, device: rocm, impl: planned}
      - {id: mlp-train-cpu, device: cpu, impl: real}
  gen.world:
    kind: world
    budget_s_2core: 30
    probe_brief: world
    ladder:
      - {id: codegen-world, device: cpu, impl: real}
  runtime.girt:
    budget_s_2core: 120
    probe_brief: "runtime:girt"
    note: >-
      Probe = the F3 party-AI headless run (Godot, no GPU) pinned to 2 cores; the policy p95 must stay inside the
      in-engine per-tick GIRT budget (500 us) with zero fallbacks. The in-engine ONNX/GPU rung is planned, not built
      (needs an onnxruntime GDExtension build + GPU). Desktop tooling `forge girt onnx-export|onnx-parity` (0.7.5) exports the
      same policy to ONNX and proves onnxruntime-CPU parity with the GDScript maths; the game does not load it (INFERENCES C-63).
    ladder:
      - {id: onnxruntime-gdextension, device: vulkan, impl: planned}
      - {id: mlp-gdscript, device: cpu, impl: real}
  qa.balance:
    budget_s_2core: 180
    probe_brief: "runtime:balance"
    note: >-
      Probe = a reduced matrix (12 matchups x 2 seeds = 24 headless encounters) over 2 worker shards pinned to 2 cores.
      The full 2400-fight G-BAL-01 run is F5/F6 acceptance and was not re-timed on the 2-core node.
    ladder:
      - {id: godot-headless-shards, device: cpu, impl: real}
  recon.splat:
    gpu_required: true
    route: loomcluster
    note: >-
      Full-scale 3DGS training (SplatForge, C12: anisotropic, SH3, densification, capture resolution) has no practical CPU
      path; the honest degraded route is CPU photogrammetry (`recon.sfm`, real since 0.7.7). A bounded tiny-scene CPU
      trainer is real as its own op `recon.splat_cpu`; it is not a rung here because it cannot do this op's job at scale.
      A COLMAP-binary CPU rung stays planned (not bundled).
    ladder:
      - {id: opensplat-rocm, device: rocm, impl: planned}
      - {id: colmap-cpu-photogrammetry, device: cpu, impl: planned}
  recon.splat_cpu:
    budget_s_2core: 60
    probe_brief: "runtime:splat-cpu"
    note: >-
      SplatForge CPU rung (C12, 0.7.7): own NumPy 3DGS trainer — isotropic Gaussians, SH degree 0, dense depth-sorted alpha
      compositing, analytic gradients, Adam, opacity pruning; BLAS-free matmuls so the trained .ply is byte-identical at any
      thread count. Bounded to ≤ 2000 splats, ≤ 96 px, ≤ 24 views (refuses beyond). The probe: rendered 9-view scene → CPU
      SfM → 250 splats × 200 steps at 40 px.
    ladder:
      - {id: splatforge-numpy-cpu, device: cpu, impl: real}
  recon.sfm:
    budget_s_2core: 60
    probe_brief: "runtime:sfm"
    note: >-
      CPU photogrammetry (C12, 0.7.7): SIFT + ratio matching + F-RANSAC, USAC essential init pair, SQPnP-RANSAC
      registration, multi-view DLT + PnP-LM alternation (no full bundle adjustment), single-threaded → byte-identical.
    ladder:
      - {id: opencv-sift-sfm-cpu, device: cpu, impl: real}
  # ---- C9–C12 (companion track): CPU-real rungs where cheap + spec-grounded; everything else planned + labelled stub ----
  mirror.encode:
    budget_s_2core: 10
    probe_brief: "runtime:mirror"
    note: >-
      MirrorWeave frame encoding on the desktop. CPU video = VP8/VP9 via libvpx through the system ffmpeg (realtime, no lag
      frames; the probe encodes 12 frames single-threaded so the digest is host-independent); stills (png/jpeg/webp) are the
      last rung. Desktop hardware H.264 (VAAPI/AMF via ffmpeg, Vulkan video) stays planned — no GPU on the build box. The phone
      encodes H.264 on its own MediaCodec hardware (PocketLoom, real_unverified_on_device), outside this desktop ladder.
    ladder:
      - {id: mirror-h264-hw, device: vulkan, impl: planned}
      - {id: mirror-vpx-cpu, device: cpu, impl: real}
      - {id: mirror-stills, device: cpu, impl: real}
  lens.assess:
    budget_s_2core: 10
    probe_brief: "runtime:lens"
    note: LensForge capture quality (sharpness/exposure/resolution), integer pixel math; pure CPU by design (C10).
    ladder:
      - {id: lensforge-quality-cpu, device: cpu, impl: real}
  depth.distance:
    budget_s_2core: 10
    probe_brief: "runtime:depth"
    note: Monocular distance (pinhole, known size) + scale/shift alignment of a relative depth map (C11). CPU only.
    ladder:
      - {id: pinhole-align-cpu, device: cpu, impl: real}
  depth.estimate:
    budget_s_2core: 30
    probe_brief: "runtime:depth-dense"
    requires_model: depth-anything-v2-small
    note: >-
      Dense relative depth (C11): DepthAnything V2 Small (Apache-2.0) ONNX on the onnxruntime CPU EP, single intra-op thread in
      the probe so the float32 map is bit-identical pinned/unpinned. Weights are fetched with SHA-256 (`forge models fetch`);
      without them `verify` reports `model_absent` (fails only with FORGE_REQUIRE_MODELS=1). The ROCm EP rung stays planned — no
      GPU on the build box. ARCore depth (phone, `depth.arcore`) supplies metric anchors for this map; its phone half is
      `real_unverified_on_device`.
    ladder:
      - {id: depthanything-v2-onnx, device: rocm, impl: planned}
      - {id: depthanything-v2-onnx-cpu, device: cpu, impl: real}
  recon.plan:
    budget_s_2core: 20
    probe_brief: "runtime:recon"
    note: RealityLoom routing + capture bundle + plan + 3DGS .ply validator (C12). CPU only; trains/reconstructs nothing.
    ladder:
      - {id: realityloom-plan-cpu, device: cpu, impl: real}
  recon.mesh:
    budget_s_2core: 60
    probe_brief: "runtime:recon-mesh"
    note: >-
      MeshWeaver splat→mesh (spec "Phase 2 reconstruction"). CPU rung (0.7.7): opacity-weighted Gaussian density on a voxel
      grid → naive surface nets (own NumPy) → vertex-coloured OBJ. The learned SuGaR/GOF-class rung needs a GPU → planned.
    ladder:
      - {id: meshweaver-sugar, device: rocm, impl: planned}
      - {id: meshweaver-density-surfacenets-cpu, device: cpu, impl: real}
  shuttle.gdgs:
    budget_s_2core: 30
    probe_brief: "runtime:gdgs"
    note: >-
      ShuttleLine Godot 3DGS import. CPU rung (0.7.7): splat .ply → Godot MultiMesh billboard scene (isotropic, unsorted
      alpha, Compatibility renderer); acceptance loads + renders it in Godot under Xvfb. Exact anisotropic sorted 3DGS
      rasterisation (GDGS plugin / compute) stays planned.
    ladder:
      - {id: gdgs-raster-import, device: vulkan, impl: planned}
      - {id: gdgs-multimesh-billboard-cpu, device: cpu, impl: real}
