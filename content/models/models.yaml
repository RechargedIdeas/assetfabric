# store/models/<id>/ (gitignored) and refuses a file whose SHA-256 differs. Every entry must carry a licence that allows
# proprietary commercial use (BoltPack audits this list; THIRD_PARTY_NOTICES.md mirrors it).
schema: models/1
models:
  depth-anything-v2-small:
    licence: Apache-2.0
    licence_source: "https://huggingface.co/depth-anything/Depth-Anything-V2-Small (model card: apache-2.0); ONNX export https://huggingface.co/onnx-community/depth-anything-v2-small (apache-2.0)"
    forbidden_siblings: "Depth-Anything-V2-Base/Large/Giant are CC-BY-NC-4.0 — non-commercial, never use"
    use: "C11 dense relative depth (depth.dense_estimate), onnxruntime CPU EP"
    files:
      - path: model.onnx
        url: "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/4472b7362082ad9968fee890ca0f1e5aca36b93d/onnx/model.onnx"
        sha256: afb6a5c28f3b6bf1618c6e43f02073ef9dfdc70e937502d51603e57b0a1df10c
        bytes: 99060839
    preprocess: {size: 518, multiple_of: 14, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], resample: bicubic}
