# Tier system: stats scale by tier multiplier; tiers add weaknesses/abilities (GAME_SPEC §4.4).
schema_version: "1.0"
tier_scale: {1: 1.0, 2: 1.6, 3: 3.2}
enemies:
  - id: emberling
    tier: 1
    stats: {hp: 24, atk: 4, def: 0, speed: 0.8, aggro: 112}
    abilities: [claw]
    weakness: water
    sprite: {archetype: beast, palette: enemy_ember, seed: 3}
  - id: cave_mite
    tier: 1
    stats: {hp: 16, atk: 3, def: 0, speed: 1.1, aggro: 120}
    abilities: [spit, claw]
    weakness: fire
    sprite: {archetype: pet, palette: enemy_ember, seed: 27}
  - id: rock_brute
    tier: 2
    stats: {hp: 40, atk: 5, def: 2, speed: 0.7, aggro: 100}
    abilities: [smash, claw]
    weakness: arcane
    sprite: {archetype: humanoid, palette: enemy_ember, seed: 40}
  # F5 first boss. Hierarchical: a phase manager (HP thresholds) swaps the worker's
  # ability set / speed, summons adds and enrages; the worker is the normal enemy BT.
  - id: cave_warden
    tier: 3
    boss: true
    # hp/atk picked with `forge balance tune` (Optuna TPE, CPU, seed_base 50000) during F5 development and
    # verified by G-BAL-01 on seed_base 1000; reproducible log: docs/acceptance-tests/results/F5-tune.json
    stats: {hp: 89.6, atk: 4.3, def: 1, speed: 0.6, aggro: 160}
    abilities: [cleave, ember_bolt]
    weakness: water
    phases:
      - {at: 1.0, abilities: [cleave, ember_bolt], speed: 0.6}
      - {at: 0.66, abilities: [quake, cleave, ember_bolt], speed: 0.7, summon: {ref: emberling, count: 2}}
      - {at: 0.33, abilities: [quake, cleave, ember_bolt], speed: 0.85, atk_mult: 1.25}
    sprite: {archetype: humanoid, palette: enemy_ember, seed: 61}
