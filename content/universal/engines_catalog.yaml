named_tools:
- id: unreal-engine
  name: Unreal Engine
  kind: engine
  vendor: Epic Games
  dims:
  - 2d
  - 3d
  adapter: unreal
  tier: interchange_pack
  direction: export
  convention: unreal
  linux_editor: true
  formats:
  - glb
  - png
  - texturepacker-json
  - unreal-python-import-script
  - json-manifest
  note: UE5 Interchange imports glTF/GLB; Paper2D imports TexturePacker JSON sheets; normal maps converted to DirectX green-down. FBX is NOT written
    (no verified writer).
- id: unity
  name: Unity
  kind: engine
  vendor: Unity Technologies
  dims:
  - 2d
  - 2.5d
  - 3d
  adapter: unity
  tier: interchange_pack
  direction: export
  convention: unity
  linux_editor: true
  formats:
  - upm-package
  - unitypackage
  - meta-yaml
  - obj
  - glb
  - png
  note: OBJ imports natively; GLB via the com.unity.cloud.gltfast package dependency; Sprite .meta files carry Multiple-mode rects (bottom-left
    origin).
- id: godot
  name: Godot
  kind: engine
  vendor: Godot Foundation
  dims:
  - 2d
  - 2.5d
  - 3d
  adapter: godot
  tier: native_verified
  direction: both
  convention: godot
  linux_editor: true
  native_binary: godot
  formats:
  - glb
  - png
  - tres-spriteframes
  note: Godot 4.3 headless loads every GLB through GLTFDocument in CI.
- id: blender
  name: Blender
  kind: tool
  vendor: Blender Foundation
  dims:
  - 3d
  adapter: blender
  tier: native_verified
  direction: both
  convention: blender
  linux_editor: true
  native_binary: blender
  formats:
  - glb
  - obj
  - stl
  - bpy-import-script
  note: Bridge script runs in `blender --background`; CI has no Blender, so CI checks the script's AST/contract and the box run is recorded.
- id: openscad
  name: OpenSCAD
  kind: tool
  vendor: OpenSCAD project
  dims:
  - 3d
  adapter: openscad
  tier: cli_bridge
  direction: both
  convention: zup-rh
  linux_editor: true
  native_binary: openscad
  formats:
  - scad
  - stl
  - false
  - obj
  - glb
  note: Parametric templates compile through the real OpenSCAD CLI; the NumPy CSG fallback runs when it is absent.
