id: cog
version: 1
title_key: universal.parametric.cog.title
units: mm
unit_m: 0.001
tri_budget: 80000
params:
  radius:    {type: float, min: 10, max: 200, default: 40}
  thickness: {type: float, min: 2, max: 40, default: 8}
  teeth:     {type: int, min: 6, max: 48, default: 12}
  tooth:     {type: float, min: 2, max: 30, default: 8}
  bore:      {type: float, min: 1, max: 60, default: 8}
  segments:  {type: int, min: 12, max: 128, default: 48}
fn: segments
tree:
  op: difference
  children:
    - op: union
      children:
        - {op: cylinder, h: thickness, r: radius}
        - op: repeat_rotate
          n: teeth
          axis: z
          children: [{op: translate, v: ["radius + tooth/2 - 1", 0, "thickness/2"], children: [{op: cube, size: [tooth, "tooth*0.8", thickness], center: true}]}]
    - {op: translate, v: [0, 0, -1], children: [{op: cylinder, h: "thickness + 2", r: bore}]}
