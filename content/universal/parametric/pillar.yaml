id: pillar
version: 1
title_key: universal.parametric.pillar.title
units: m
unit_m: 1.0
tri_budget: 60000
params:
  radius:   {type: float, min: 0.1, max: 1.5, default: 0.3}
  height:   {type: float, min: 0.5, max: 6.0, default: 2.5}
  cap:      {type: float, min: 0.05, max: 0.5, default: 0.15}
  taper:    {type: float, min: 0.6, max: 1.0, default: 0.85}
  segments: {type: int, min: 8, max: 96, default: 40}
fn: segments
tree:
  op: union
  children:
    - {op: cube, size: ["2.6*radius", "2.6*radius", cap], center: false}
    - {op: translate, v: ["1.3*radius", "1.3*radius", cap], children: [{op: cylinder, h: "height - 2*cap", r1: radius, r2: "radius*taper"}]}
    - {op: translate, v: [0, 0, "height - cap"], children: [{op: cube, size: ["2.6*radius", "2.6*radius", cap]}]}
