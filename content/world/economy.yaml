# F6 economy — items, crops, recipes, shop, starter kit, XP curve (GAME_SPEC §4.4 farming loop).
# [INFERENCE F6-3] GAME_SPEC leaves crops/economy unspecified ("implement minimal gather/grow/craft
# loop that feeds loot/economy schema"); every name and number here is a placeholder (like D-005).
schema_version: "1.0"
items:
  - {id: coin, kind: currency}
  - {id: sunroot_seed, kind: seed, crop: sunroot}
  - {id: glowcap_spore, kind: seed, crop: glowcap}
  - {id: sunroot, kind: crop, sell: 2}
  - {id: glowcap, kind: crop, sell: 3}
  - {id: flint, kind: material, sell: 1}
  - {id: cave_moss, kind: material, sell: 1}
  - {id: ember_shard, kind: material, sell: 4}
  - {id: brute_hide, kind: material, sell: 6}
  - {id: warden_core, kind: material}
  # crafted — consumables apply out of combat or at the next fight; gear is permanent
  - {id: moss_salve, kind: consumable, use: {heal_pct: 0.5}}          # whole party, out of combat
  - {id: ember_tonic, kind: consumable, use: {buff: {atk_pct: 0.15}}}  # shared buff, next encounter
  - {id: flint_edge, kind: gear, slot: shared, bonus: {atk_pct: 0.06}} # shared item: whole party
  - {id: warden_charm, kind: gear, slot: unique, bonus: {def_flat: 1.5}}  # character-unique: leader
crops:
  # growth in world ticks (60 Hz); the farm keeps growing while the party is away.
  # Q4 pacing [INFERENCE C-91]: 2 / 3 game-minutes (was 40 s / 60 s) so a crop cycle spans a cave run.
  - {id: sunroot, seed: sunroot_seed, grow_ticks: 7200, yield: 2}
  - {id: glowcap, seed: glowcap_spore, grow_ticks: 10800, yield: 2}
recipes:
  - {id: moss_salve, out: {moss_salve: 1}, in: {cave_moss: 1, sunroot: 1}}
  - {id: ember_tonic, out: {ember_tonic: 1}, in: {glowcap: 2, flint: 1}}
  - {id: flint_edge, out: {flint_edge: 1}, in: {flint: 2, ember_shard: 2}}
  - {id: warden_charm, out: {warden_charm: 1}, in: {warden_core: 1, glowcap: 1}}
shop:     # farm stall (bench tile): buy seeds with loot coins
  sunroot_seed: 3
  glowcap_spore: 4
start_kit: {sunroot_seed: 2, glowcap_spore: 2, coin: 5}
farm:
  plots: 4
xp:
  per_tier: 10                      # same rule as F5 save_progress (INFERENCE F5-5)
  level_at: [0, 30, 90, 200, 360]   # cumulative xp for level 1..5 [INFERENCE F6-4]
  start_level: 2
