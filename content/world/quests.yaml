# F6 quest state machines. Each quest compiles to one region of a parallel statechart
# (forge/statechart.py + sim/statechart.gd), so the F4/F5 static soft-lock analysis applies.
# A stage advances on `when` (a world event; not `on`, which YAML 1.1 reads as true) when its guard holds; guards read world counters:
#   have:<item>>=n  · total:<counter>>=n  · flag:<name>
# World events: select, plant, harvest, gather, craft, enter:<area>, cleared:<area>, defeated:<ref>, save
# Rewards (coin / item / xp / unlock (roster) / flag) are granted when that stage completes.
schema_version: "1.0"
quests:
  - id: q_warden
    title: quest.q_warden.title
    main: true
    stages:
      - {id: choose, when: select}
      - {id: plant, when: plant, guard: "total:planted>=2", reward: {xp: 0}}
      - {id: forage, when: gather, guard: "have:flint>=3", reward: {coin: 3}}
      - {id: enter_cave, when: "enter:cave_deep"}
      - {id: moss, when: gather, guard: "have:cave_moss>=2"}
      - {id: clear_cave, when: "cleared:cave_deep", reward: {xp: 40}}
      - {id: return_farm, when: "enter:field"}
      # Q4 pacing [INFERENCE C-91]: a full first harvest, then a second crop cycle paid with stall seeds
      # (deterministic coin: start kit + forage reward) before the boss prep — real farming loop, not a slower bot.
      - {id: harvest, when: harvest, guard: "total:harvested>=8", reward: {xp: 10}}
      - {id: replant, when: plant, guard: "total:planted>=6"}
      - {id: patrol, when: "cleared:hollow.patrol", reward: {xp: 20}}     # active beat while the crops grow
      - {id: second_harvest, when: harvest, guard: "total:harvested>=12", reward: {coin: 4}}
      - {id: craft, when: craft, guard: "have:ember_tonic>=1&have:moss_salve>=1"}
      - {id: warden, when: "defeated:cave_warden", reward: {unlock: vex, flag: warden_down}}
      # open-world transition (GAME_SPEC §6.1 item 4): out through the lair onto the ridge, clear it, walk home
      - {id: open_world, when: "enter:ridge"}
      - {id: ridge, when: "cleared:ridge", reward: {xp: 30, coin: 10}}
      - {id: home, when: "enter:field"}
      - {id: rest, when: save}
  # Q4 [INFERENCE C-91]: side quest — ore from the hollow + flint → Ember Mail (shared gear, party defence).
  # Gear goes to the gear slots, not the bag, so crafting it sets `flag:gear_<id>`.
  - id: q_smith
    title: quest.q_smith.title
    stages:
      - {id: ore, when: gather, guard: "have:ember_ore>=3", reward: {xp: 10}}
      - {id: mail, when: craft, guard: "flag:gear_ember_mail", reward: {coin: 6}}
  - id: q_forager
    title: quest.q_forager.title
    stages:
      - {id: gather_any, when: gather, guard: "total:gathered>=6", reward: {coin: 10, item: {glowcap_spore: 1}}}
