# AssetFabric project manifest — schema: docs/schemas/forge.project.schema.json
schema_version: "1.0"
name: assetfabric
description: Universal content fabric + execution substrate; Game Zero is the first MVP product.

fabric:
  milestone: F9
  version: "0.9.2+f9"

game:
  id: game-zero
  increment: liveops-readiness
  project_path: games/game-zero

targets:
  - id: godot-desktop
    kind: godot-desktop
    renderer: compatibility
    enabled: true
  # F7 packaging targets — `forge build --target <id>` (presets: games/game-zero/export_presets.cfg)
  - id: desktop-linux
    kind: godot-desktop
    renderer: compatibility
    enabled: true
  - id: desktop-windows
    kind: godot-desktop
    renderer: compatibility
    enabled: true
  - id: android
    kind: godot-android
    renderer: compatibility
    enabled: true
  - id: web
    kind: godot-web
    renderer: compatibility
    enabled: true
  - id: web-nothreads       # D-001 single-thread fallback (no SharedArrayBuffer / COOP/COEP), ADR-0019
    kind: godot-web
    renderer: compatibility
    enabled: true
  - id: studio-desktop
    kind: studio
    renderer: n/a
    enabled: true

profiles:
  weakest_acceptance:
    cpu_cores_min: 2
    gpu_required: false
    budget:
      note: "GroundWeave — every GPU capability has a CPU software path."
  t1_studio:
    cpu_cores_min: 8
    gpu_required: false

dependencies:
  - name: godot
    kind: runtime
    version: "4.3+"
    optional: false
  - name: python
    kind: tool
    version: ">=3.11"
    optional: false

briefs: []

models: {}

cluster:
  protocol:            # LoomCluster (C7) wire settings; loopback unless LoomLink exposes it
    bind: 127.0.0.1
    heartbeat_s: 0.5   # advert exchange + lease check cadence
    lease_s: 6.0       # origin re-queues a job whose owner stopped answering for this long
    steal_batch: 2     # jobs an idle node takes per steal
    http_timeout_s: 2.0
    max_attempts: 3    # a failing job is retried (tail of queue, stealable) up to this many executions
    job_timeout_s: 300.0
  nodes:               # mirrors docs/hardware-fleet.md (SPEC §10)
    - id: main
      tier: T1
      role: Studio host / heavy gen-train
      cpu_cores: 12
      ram_gb: 64
      gpus: ["RX 7900 XTX 24GB"]
      os: linux
      allocation_cap_pct: 80
    - id: secondary
      tier: T2
      role: Batch gen / parallel inference (GPUs do not pool)
      cpu_cores: 6
      ram_gb: 32
      gpus: ["Vega 64 8GB", "Vega 56 8GB"]
      os: linux
      allocation_cap_pct: 70
    - id: redmi
      tier: T3
      role: PocketLoom reference
      cpu_cores: 8
      ram_gb: 8
      gpus: ["Mali-G68"]
      os: android
      allocation_cap_pct: 50
    - id: lemur
      tier: T4
      role: Portable Studio / warm cache
      cpu_cores: 4
      ram_gb: 40
      gpus: ["UHD 620"]
      os: windows
      allocation_cap_pct: 60
    - id: nokia
      tier: T5
      role: QR / client / review
      cpu_cores: 8        # [INFERENCE C-30] Snapdragon 660 octa-core; the 2-core contract is a *test* pin, not this device
      ram_gb: 4
      gpus: []
      os: android
      allocation_cap_pct: 30
    - id: kindle-1
      tier: T5
      role: "Second-screen dashboard, no compute offered [INFERENCE: specs unknown, cap 0]"
      gpus: []
      os: fireos
      allocation_cap_pct: 0
    - id: kindle-2
      tier: T5
      role: "Second-screen dashboard, no compute offered [INFERENCE: specs unknown, cap 0]"
      gpus: []
      os: fireos
      allocation_cap_pct: 0

telemetry:
  schema_version: "1.0"
  store: sqlite
  path: .fabric/telemetry
  backpressure:
    max_queue: 10000
    drop_policy: oldest

store:
  root: store
  content_addressed: true
