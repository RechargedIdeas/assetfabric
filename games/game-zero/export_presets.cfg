; AssetFabric F7 — Game Zero export presets (checked in; no secrets).
; Keystores / SDK paths come from the hermetic editor settings that `forge build` writes
; under .fabric/godot-home (gitignored). Non-resource content (assets/generated, data/generated,
; locale) is shipped via include_filter because the editor import is bypassed (.gdignore).

[preset.0]

name="desktop-linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="fabric_desktop"
export_filter="all_resources"
include_filter="assets/generated/*,data/generated/*,locale/*.json"
exclude_filter=""
export_path="../../dist/desktop-linux/GameZero.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

