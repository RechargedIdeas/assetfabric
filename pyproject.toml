[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assetfabric-forge"
version = "0.7.5+f7"
description = "AssetFabric Content Forge — CLI, schemas, store, orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
license-files = ["LICENSE"]
authors = [{ name = "Recharged Ideas" }]
classifiers = ["Private :: Do Not Upload", "License :: Other/Proprietary License"]
dependencies = [
  "pyyaml>=6",
  "pydantic>=2",
  "jsonschema>=4",
  "click>=8",
  "rich>=13",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "websockets>=13", "onnxruntime>=1.18", "onnx>=1.16"]   # pillow: C10 decode/EXIF; websockets: C9; onnxruntime/onnx: C11 + GIRT ONNX (model tests skip without fetched weights)
mirror = ["websockets>=13", "pillow>=10"]   # C9 MirrorWeave WebSocket transport + video decode-to-PNG (system ffmpeg is a tool, not a dep)
depth = ["onnxruntime>=1.18", "onnx>=1.16", "pillow>=10"]   # C11 DepthAnything V2 Small on the CPU EP (onnxruntime MIT, onnx Apache-2.0); weights via `forge models fetch`
lens = ["pillow>=10"]             # LensForge (C10): decode JPEG/WebP, read EXIF; PNG works without it
studio = ["PySide6-Essentials>=6.6"]   # Studio window (LGPL-3.0, dynamically imported wheel — THIRD_PARTY_NOTICES)
tune = ["optuna>=3.6"]
package = ["playwright>=1.45"]   # F7 PWAPipeline smoke (drives the system Chrome; no browser download)

[project.scripts]
forge = "forge.cli:main"
assetfabric-studio = "assetfabric_studio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["forge", "studio/assetfabric_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
