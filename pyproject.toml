[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assetfabric-forge"
version = "0.3.0+f3"
description = "AssetFabric Content Forge — CLI, schemas, store, orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
license-files = ["LICENSE"]
authors = [{ name = "Recharged Ideas" }]
classifiers = ["Private :: Do Not Upload", "License :: Other/Proprietary License"]
dependencies = [
  "pyyaml>=6",
  "pydantic>=2",
  "jsonschema>=4",
  "click>=8",
  "rich>=13",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
studio = ["PySide6>=6.6"]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
